---
version: 2
updates:
  # Check for updates to GitHub Actions every week
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Check for Go module updates every week
  - package-ecosystem: "gomod"
    directory: "/src"
    schedule:
      interval: "weekly"
    groups:
      golang-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
